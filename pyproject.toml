[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubermensch-kb"
version = "0.1.0"
description = "Local-first agentic knowledge system for Obsidian vaults"
readme = "README.md"
# license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Carle Medina" }]
keywords = [
    "obsidian", "rag", "knowledge-graph", "llm",
    "note-taking", "ai", "nlp", "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=2.7",
    "chromadb>=0.5",
    "networkx>=3.6.1",
    "requests>=2.33.1",
]

[project.optional-dependencies]
gemini  = ["google-genai>=2.0.1"]
publish = ["build>=1.0", "twine>=5.0"]
dev = ["pytest>=8", "ruff", "mypy"]

[project.urls]
Homepage   = "https://github.com/controlplusn/ubermensch"
Repository = "https://github.com/controlplusn/ubermensch"
Issues     = "https://github.com/carlemedina/ubermensch/issues"

[project.scripts]
vault = "vault.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true