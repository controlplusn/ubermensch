<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" width="900" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#0d1117"/>

  <!-- Grid lines - horizontal -->
  <g stroke="#1a2332" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="50"  x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
  </g>

  <!-- Grid lines - vertical -->
  <g stroke="#1a2332" stroke-width="0.5" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
  </g>

  <!-- Top label -->
  <text x="40" y="36" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="3">VAULT-KB — LOCAL-FIRST KNOWLEDGE SYSTEM</text>
  <text x="740" y="36" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">© 2025 · MIT LICENSE</text>

  <!-- Top border line -->
  <line x1="40" y1="48" x2="860" y2="48" stroke="#1e3a5f" stroke-width="0.8"/>

  <!-- Main title left side -->
  <text x="40" y="155" font-family="monospace" font-size="72" font-weight="bold" fill="#58a6ff" letter-spacing="-1">UBER</text>
  <text x="40" y="235" font-family="monospace" font-size="72" font-weight="bold" fill="#e6edf3" letter-spacing="-1">MENSCH</text>

  <!-- Subtitle -->
  <text x="42" y="270" font-family="monospace" font-size="12" fill="#7d8590">A local-first agentic knowledge system for Obsidian vaults.</text>

  <!-- Tags row -->
  <g font-family="monospace" font-size="11">
    <!-- RAG -->
    <rect x="42" y="292" width="36" height="18" rx="3" fill="#1a2d47"/>
    <text x="60" y="305" fill="#58a6ff" text-anchor="middle">RAG</text>
    <!-- Knowledge Graph -->
    <rect x="84" y="292" width="126" height="18" rx="3" fill="#1a2d47"/>
    <text x="147" y="305" fill="#58a6ff" text-anchor="middle">KNOWLEDGE GRAPH</text>
    <!-- NLI Eval -->
    <rect x="216" y="292" width="68" height="18" rx="3" fill="#1a2d47"/>
    <text x="250" y="305" fill="#58a6ff" text-anchor="middle">NLI EVAL</text>
    <!-- Local First -->
    <rect x="290" y="292" width="86" height="18" rx="3" fill="#1a2d47"/>
    <text x="333" y="305" fill="#58a6ff" text-anchor="middle">LOCAL FIRST</text>
    <!-- Agents -->
    <rect x="382" y="292" width="60" height="18" rx="3" fill="#1a2d47"/>
    <text x="412" y="305" fill="#58a6ff" text-anchor="middle">AGENTS</text>
  </g>

  <!-- Stack diagram right side -->
  <!-- Layer labels -->
  <g font-family="monospace" font-size="10" fill="#58a6ff" letter-spacing="1">
    <text x="720" y="92"  text-anchor="end">CLI · AGENT LOOP</text>
    <text x="720" y="142" text-anchor="end">RAG · RETRIEVAL</text>
    <text x="720" y="192" text-anchor="end">KNOWLEDGE GRAPH</text>
    <text x="720" y="242" text-anchor="end">NLI EVAL · SCORING</text>
    <text x="720" y="292" text-anchor="end">LLM · GEMINI · OLLAMA</text>
    <text x="720" y="342" text-anchor="end">OBSIDIAN VAULT</text>
  </g>

  <!-- Layer connectors -->
  <g stroke="#1e3a5f" stroke-width="0.6">
    <line x1="724" y1="86"  x2="860" y2="86"/>
    <line x1="724" y1="136" x2="860" y2="136"/>
    <line x1="724" y1="186" x2="860" y2="186"/>
    <line x1="724" y1="236" x2="860" y2="236"/>
    <line x1="724" y1="286" x2="860" y2="286"/>
    <line x1="724" y1="336" x2="860" y2="336"/>
  </g>

  <!-- Layer bars -->
  <g opacity="0.85">
    <rect x="726" y="62"  width="130" height="22" rx="2" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <rect x="730" y="66"  width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>

    <rect x="726" y="112" width="130" height="22" rx="2" fill="none" stroke="#3fb950" stroke-width="1"/>
    <rect x="730" y="116" width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>

    <rect x="726" y="162" width="130" height="22" rx="2" fill="none" stroke="#d29922" stroke-width="1"/>
    <rect x="730" y="166" width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>

    <rect x="726" y="212" width="130" height="22" rx="2" fill="none" stroke="#f85149" stroke-width="1"/>
    <rect x="730" y="216" width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>

    <rect x="726" y="262" width="130" height="22" rx="2" fill="none" stroke="#bc8cff" stroke-width="1"/>
    <rect x="730" y="266" width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>

    <rect x="726" y="312" width="130" height="22" rx="2" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <rect x="730" y="316" width="122" height="14" rx="1" fill="#0d2137" opacity="0.8"/>
  </g>

  <!-- Vertical connector line between layers -->
  <line x1="791" y1="84"  x2="791" y2="112" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="791" y1="134" x2="791" y2="162" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="791" y1="184" x2="791" y2="212" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="791" y1="234" x2="791" y2="262" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="791" y1="284" x2="791" y2="312" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bottom section -->
  <line x1="40" y1="352" x2="860" y2="352" stroke="#1e3a5f" stroke-width="0.8"/>
  <text x="42"  y="372" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">PYTHON 3.11+</text>
  <text x="160" y="372" font-family="monospace" font-size="11" fill="#3a5a8a">·</text>
  <text x="175" y="372" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">SENTENCE-TRANSFORMERS</text>
  <text x="430" y="372" font-family="monospace" font-size="11" fill="#3a5a8a">·</text>
  <text x="445" y="372" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">CHROMADB</text>
  <text x="570" y="372" font-family="monospace" font-size="11" fill="#3a5a8a">·</text>
  <text x="585" y="372" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">NETWORKX</text>
  <text x="700" y="372" font-family="monospace" font-size="11" fill="#3a5a8a">·</text>
  <text x="715" y="372" font-family="monospace" font-size="11" fill="#3a5a8a" letter-spacing="2">RICH · TYPER</text>

  <!-- Bottom border -->
  <line x1="40" y1="388" x2="860" y2="388" stroke="#1e3a5f" stroke-width="0.8"/>
</svg>
